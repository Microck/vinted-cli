name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: existing tag to release
        required: true
      npm_only:
        description: publish npm for an existing release using packaging from this workflow ref
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    if: ${{ !inputs.npm_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Manual retries keep the source tag intact but use packaging fixes from
      # the selected workflow ref (the same approach as npm_only recovery).
      - name: prepare release configuration
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: git show "$WORKFLOW_SHA:.goreleaser.yaml" > "$RUNNER_TEMP/goreleaser.yaml"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --config ${{ runner.temp }}/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token with write access to Microck/homebrew-tap and Microck/scoop-bucket.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      - name: attest checksums
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/checksums.txt

  npm:
    needs: goreleaser
    if: ${{ always() && (needs.goreleaser.result == 'success' || inputs.npm_only) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.npm_only && github.ref || inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Leave token auth unconfigured so npm can use its OIDC exchange.
          package-manager-cache: false
      - name: select released version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node -e 'if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG)) throw new Error("release_tag must be a version tag such as v1.2.3")'
          gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then error("release is still a draft") else . end'
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version --ignore-scripts --prefix npm
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo 'tag=next' >> "$GITHUB_OUTPUT"
          else
            echo 'tag=latest' >> "$GITHUB_OUTPUT"
          fi
      - name: install packaging dependencies
        working-directory: npm
        run: npm ci --ignore-scripts
      - name: publish with npm trusted publishing
        working-directory: npm
        run: npm publish --access public --tag "${{ steps.version.outputs.tag }}"
